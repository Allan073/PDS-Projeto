<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CBM - Cadastro</title>
</head>
<body>
<div id="signup">
    <label for="username">Username: </label><input id="username" type="text"> <br>
    <label for="email">Email: </label><input id="email" type="text"> <br>
    <label for="password">Senha: </label><input id="password" type="text"> <br>
    <label for="customer">Cliente</label><input id="customer" type="radio" name="role" value="ROLE_CUSTOMER">
    <label for="admin">Admin</label><input id="admin" type="radio" name="role" value="ROLE_ADMINISTRATOR"> <br>
    <input id="submit" type="button" onclick="submitForm()">
</div>
<script>
    function User(username,email,password,role) {
        this.user = username
        this.email = email
        this.password = password
        this.role = role
    }

    function submitForm() {
        const username = document.getElementById("username").value
        const email = document.getElementById("email").value
        const passwd = document.getElementById("password").value
        const role = document.querySelector("input[type='radio'][name=role]:checked").value;
        let js = new User(username,email,passwd,role)
        js = JSON.stringify(js)
        signupRequest(js)
        console.log(js)
    }

    async function signupRequest(user) {
        fetch('http://localhost:8080/users', {
            method: 'POST',
            headers: {
                'Content-Type':'application/json'
            },
            body: user,
        }).then(response => response.json()).then(data => {
            console.log('POST Request Data:', data);
        })
            .catch(error => {
                console.error('Error:', error);
            });
    }
</script>
</body>
</html>
